name: Read musicinslc inbox

on:
  schedule:
    - cron: "41 * * * *"     # hourly
  workflow_dispatch:

concurrency: { group: ingest-inbox, cancel-in-progress: false }

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: ingest } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ingest/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Read inbox
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          INBOX_ADDRESS: ${{ vars.INBOX_ADDRESS || 'musicinslc@gmail.com' }}
          INBOX_APP_PASSWORD: ${{ secrets.INBOX_APP_PASSWORD }}
          TRUSTED_SENDERS: ${{ vars.TRUSTED_SENDERS }}
        run: python run_email.py
