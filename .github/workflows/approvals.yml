name: Weekly approval email

on:
  schedule:
    - cron: "13 15 * * 2"    # Tuesdays, 8:13 or 9:13 in Salt Lake depending on daylight time
  workflow_dispatch:

jobs:
  approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: ingest } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ingest/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Send approval email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INBOX_ADDRESS: ${{ vars.INBOX_ADDRESS || 'musicinslc@gmail.com' }}
          INBOX_APP_PASSWORD: ${{ secrets.INBOX_APP_PASSWORD }}
          APPROVALS_TO: ${{ vars.APPROVALS_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python run_approvals.py
