name: Diagnose sources

on:
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments for diagnose.py, e.g. --scrape soundwell, --db, or --render --url https://..."
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: ingest } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ingest/requirements.txt }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Diagnose
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          ARGS: ${{ github.event.inputs.args }}
        run: |
          eval python diagnose.py $ARGS
