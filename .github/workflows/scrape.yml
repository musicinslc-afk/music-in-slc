name: Scrape venues

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      only:
        description: "Run one source (venue slug, 'ticketmaster', 'seatgeek', ...); blank for all. Flyers and band links always run after"
        required: false

concurrency: { group: ingest-scrape, cancel-in-progress: false }

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: ingest } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ingest/requirements.txt }
      - run: pip install -r requirements.txt
      # Headless browser for venues whose calendars are drawn by JavaScript (strategy: render)
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests
      - name: Scrape and sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python run_scrapers.py --only "$ONLY"
          else
            python run_scrapers.py
          fi
