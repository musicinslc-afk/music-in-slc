name: Publish website

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp local scripts, styles and data with this commit so browsers never mix an old cached file with new pages
      - name: Version assets
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"([a-z]+\.(js|css))\"#\1=\"\2?v=$v\"#g" web/*.html
          sed -i "s#fetch(\"genres.json\")#fetch(\"genres.json?v=$v\")#" web/data.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4
