# Salt Lake County venues.
#
# Every entry is synced to the `venues` table on each scraper run.
# `calendar_urls` are the pages the scraper reads. Strategy "auto" tries, in order:
#   1. a layout parser, if `parser` is set (see ingest/slclive/sources/venue_parsers.py)
#   2. schema.org Event JSON-LD embedded in the page (most ticketing widgets emit this)
#   3. links to ticket pages that carry event data (24tix)
#   4. an iCal feed, if `ics_url` is set
#   5. the AI page reader (needs ANTHROPIC_API_KEY), which reads the page like a person would
# Strategy "render" does the same on the page as a browser draws it, for calendars built by
# JavaScript (it needs Playwright, which the scrape workflow installs).
# Use strategy "feeds_only" for venues whose shows come through Ticketmaster, email or submissions (no page to scrape).
# `ticketsauce_partner` reads a Ticketsauce seller's event list directly (see sources/ticketsauce.py).
#
# `music_only: true` is for mixed-use rooms: live music publishes, events that are clearly not
# music (drag shows, screenings, trivia) are dropped, and anything unclear waits for review.
#
# Coverage watchdog: `expect_shows_within_days: N` flags the venue in Source health and the
# weekly digest when it has no published show in the next N days. `seasonal: true` keeps it
# quiet from October through March.
#
# IMPORTANT: confirm each calendar URL in a browser before launch. Venues change
# websites often; the admin page's "Source health" panel flags any URL that stops working.
# `aliases` are other spellings ticket sites use, so duplicates merge correctly.

# Calendar feeds that cover many venues at once. Shows at venues listed below publish
# directly; shows at venues not listed here go to the review queue, since a feed can
# include venues outside Salt Lake County.
feeds:
  - name: 24tix
    url: https://www.24tix.com/calendar.ics   # S&S Presents venues and other local rooms

venues:
